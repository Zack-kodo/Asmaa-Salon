<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكتالوگ - BEAUTYSALON</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7e6f7;
    --yellow:#fdd304;
    --green:#41f095;
    --pink:#fa9dbc;
    --dark:#3a2b3a;
    --bg-opacity:0.15;
  }
  .bg-image{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:url('assets/background.jpg');
    background-size:cover;background-position:center;
    opacity:var(--bg-opacity);z-index:-1;
  }
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);min-height:100vh;padding:20px;
  }
  .card{
    max-width:420px;margin:0 auto;
    background:rgba(255,255,255,0.95);
    border-radius:32px;overflow:hidden;
    box-shadow:0 20px 60px rgba(170,120,160,.25);
    backdrop-filter:blur(10px);
  }
  .header{
    padding:24px 28px 10px;text-align:center;
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--dark);text-decoration:none;font-weight:700;
    font-size:14px;margin-bottom:14px;
  }
  .back-btn svg{width:18px;height:18px;fill:var(--dark)}
  h1{
    font-family:'Poppins',sans-serif;
    font-size:24px;color:var(--dark);margin-bottom:6px;
  }
  .underline{
    width:48px;height:4px;border-radius:4px;
    background:var(--yellow);margin:0 auto;
  }

  /* ====== شبكة الكتالوگ ====== */
  .catalogue-grid{
    padding:16px 20px 24px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .cat-item{
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    transition:transform .18s;
  }
  .cat-item:hover{transform:translateY(-3px)}
  .cat-item img{
    width:100%;height:160px;object-fit:cover;display:block;
  }
  .cat-item .info{
    padding:10px 12px;
  }
  .cat-item .name{
    font-size:14px;font-weight:700;color:var(--dark);margin-bottom:2px;
  }
  .cat-item .price{
    font-size:13px;color:var(--pink);font-weight:700;
  }

  /* زر احجز تحت */
  .book-section{
    padding:0 20px 28px;text-align:center;
  }
  .btn{
    display:block;width:100%;padding:15px;border-radius:16px;
    font-family:'Cairo',sans-serif;font-size:16px;font-weight:700;
    text-decoration:none;transition:transform .18s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-yellow{background:var(--yellow);color:#5a4a00;box-shadow:0 8px 20px rgba(253,211,4,.4)}
  .btn-green{background:var(--green);color:#0a5a32;box-shadow:0 8px 20px rgba(65,240,149,.4);margin-bottom:12px}
</style>
</head>
<body>
<div class="bg-image"></div>

<div class="card">

  <div class="header">
    <!-- زر رجوع -->
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      رجوع للبروفايل
    </a>
    <h1>📋 الكتالوگ</h1>
    <div class="underline"></div>
  </div>

  <!-- ====== الصور - بدّلها من assets ====== -->
  <div class="catalogue-grid">

    <div class="cat-item">
      <img src="assets/cat-1.jpg" alt="خدمة 1">
      <div class="info">
        <div class="name">مانيكير</div>
        <div class="price">من 150 درهم</div>
      </div>
    </div>

    <div class="cat-item">
      <img src="assets/cat-2.jpg" alt="خدمة 2">
      <div class="info">
        <div class="name">بيدكير</div>
        <div class="price">من 180 درهم</div>
      </div>
    </div>

    <div class="cat-item">
      <img src="assets/cat-3.jpg" alt="خدمة 3">
      <div class="info">
        <div class="name">ميكاب</div>
        <div class="price">من 250 درهم</div>
      </div>
    </div>

    <div class="cat-item">
      <img src="assets/cat-4.jpg" alt="خدمة 4">
      <div class="info">
        <div class="name"> coiffure</div>
        <div class="price">من 200 درهم</div>
      </div>
    </div>

  </div>

  <!-- زر احجز -->
  <div class="book-section">
    <a href="https://wa.me/212600000000" class="btn btn-yellow">📞 احجزي دابا</a>
  </div>

</div>
</body>
</html>
